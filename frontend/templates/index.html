{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0" id="catHeaderTitle">دسته‌بندی رویدادها</h3>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-3 col-6" onclick="handleCategoryClick('TOURNAMENT')">
            <div class="cat-card-modern text-center p-4 rounded-4">
                <div class="icon-box bg-warning-soft text-warning mx-auto mb-3"><i class="bi bi-trophy fs-3"></i></div>
                <h5 class="fw-bold mt-2">تورنمنت</h5>
                <p class="text-muted small mb-0">کلیک جهت ایجاد یا فیلتر مسابقات</p>
            </div>
        </div>
        <div class="col-md-3 col-6" onclick="handleCategoryClick('WEBINAR')">
            <div class="cat-card-modern text-center p-4 rounded-4">
                <div class="icon-box bg-info-soft text-info mx-auto mb-3"><i class="bi bi-camera-video fs-3"></i></div>
                <h5 class="fw-bold mt-2">وبینار</h5>
                <p class="text-muted small mb-0">کلیک جهت ایجاد یا فیلتر سمینارها</p>
            </div>
        </div>
        <div class="col-md-3 col-6" onclick="handleCategoryClick('WORKSHOP')">
            <div class="cat-card-modern text-center p-4 rounded-4">
                <div class="icon-box bg-success-soft text-success mx-auto mb-3"><i class="bi bi-journal-bookmark fs-3"></i></div>
                <h5 class="fw-bold mt-2">ورکشاپ</h5>
                <p class="text-muted small mb-0">کلیک جهت ایجاد یا فیلتر کارگاه‌ها</p>
            </div>
        </div>
        <div class="col-md-3 col-6" onclick="handleCategoryClick('SPORTS')">
            <div class="cat-card-modern text-center p-4 rounded-4">
                <div class="icon-box bg-danger-soft text-danger mx-auto mb-3"><i class="bi bi-dribbble fs-3"></i></div>
                <h5 class="fw-bold mt-2">رویداد ورزشی</h5>
                <p class="text-muted small mb-0">کلیک جهت ایجاد یا فیلتر مسابقات ورزشی</p>
            </div>
        </div>
    </div>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center mb-4 gap-3">
        <h4 class="fw-bold mb-0" id="sectionTitle">رویدادهای منتشرشده</h4>
        <div class="d-flex gap-2 w-100 w-md-auto">
            <input type="text" id="searchInput" class="form-control search-box" placeholder="🔍 جستجوی عنوان رویداد..." onkeyup="handleSearch()">
            <button class="btn btn-outline-secondary rounded-3 px-3" onclick="resetFilters()">همه</button>
        </div>
    </div>

    <div class="row g-4" id="eventsList"></div>
</div>
{% endblock %}
